# Checks every push and pull request: lint, type check, unit tests, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci rejects the lockfile because of an npm bug with optional wasm
      # packages (@emnapi); npm install matches what Vercel does.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # The build only needs placeholder Firebase values; no secrets are used.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
